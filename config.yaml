# ---------------------------------------------------------------------------
# تنظیمات ربات پایش آپارتمان دیوار
# این فایل را برای تغییر بازه قیمت، محله‌ها و ویژگی‌های موردنظر ویرایش کن.
# بعد از هر تغییر، فایل را commit و push کن تا در اجرای بعدی اعمال شود.
# ---------------------------------------------------------------------------

city: "تهران"

price:
  min_toman: 4000000000   # ۴ میلیارد تومان
  max_toman: 6000000000   # ۶ میلیارد تومان

# حداقل متراژ (متر مربع)
min_area_m2: 50

# محله‌های موردنظر؛ اگر خالی بماند، کل تهران جستجو و رتبه‌بندی می‌شود.
# اسم محله‌ها را همان‌طور که در دیوار نوشته می‌شود وارد کن.
# مثال: districts: ["شهرزیبا", "پونک", "جنت‌آباد", "شهرک غرب"]
districts: []

# حداقل درصد ارزان‌تر بودن نسبت به میانه قیمتِ-هر-متر آگهی‌های مشابه
# (هرچه بالاتر، سخت‌گیرانه‌تر و تعداد هشدارها کمتر می‌شود)
min_discount_pct: 12

# چند صفحه نتیجه (هر صفحه حدود ۲۵ آگهی) در هر اجرا بررسی شود.
# عدد بالاتر = پوشش بیشتر ولی کندتر و درخواست بیشتر به دیوار.
pages_per_run: 6

# فقط آگهی‌های منتشرشده در این بازه ساعت اخیر را در نظر بگیر (خالی = بدون محدودیت)
max_age_hours: null

# ---------------------------------------------------------------------------
# ویژگی‌های دلخواه. سه حالت ممکن برای هرکدام:
#   true  -> فقط آگهی‌هایی که این ویژگی را «دارند» نگه داشته می‌شوند
#   false -> فقط آگهی‌هایی که این ویژگی را «ندارند» نگه داشته می‌شوند
#   null  -> فیلتر نمی‌شود؛ ولی در پیام تلگرام نشان داده می‌شود اگر تشخیص داده شود
# ---------------------------------------------------------------------------
require:
  parking: null             # پارکینگ
  storage: null             # انباری
  elevator: null            # آسانسور
  single_sheet_deed: null   # سند تک‌برگ

# ---------------------------------------------------------------------------
# تنظیمات پیشرفته / اشکال‌زدایی - معمولاً نیازی به تغییر این دو نیست.
# ---------------------------------------------------------------------------

# اگر تشخیص خودکار دسته‌ی «خرید آپارتمان» روی دیوار اشتباه بود، اسلاگ درست را
# اینجا بگذار (در لاگ اجرای دستی از تب Actions در گیت‌هاب، اسلاگ تشخیص‌داده‌شده
# چاپ می‌شود؛ اگر غلط بود همان را اصلاح‌شده اینجا وارد کن).
category_override: null

# هر فیلتر خام دیگری که بخواهی مستقیم به dv_search پاس بدهی (کلیدهای دقیق را
# از لاگ dv_filters در اجرای Actions پیدا کن). مثال:
# filters_override:
#   rooms: ["دو", "سه"]
filters_override: {}
